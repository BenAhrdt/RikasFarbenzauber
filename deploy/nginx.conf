# Place inside nginx's http context (e.g. sites-available).
limit_req_zone $binary_remote_addr zone=rika_login:10m rate=6r/m;
server {
    listen 80;
    server_name farben.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name farben.example.org;
    ssl_certificate /etc/letsencrypt/live/farben.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farben.example.org/privkey.pem;
    client_max_body_size 100k;
    location /static/ {
        alias /var/www/rikas-static/;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/photos/ {
        client_max_body_size 13m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /login/ {
        limit_req zone=rika_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
